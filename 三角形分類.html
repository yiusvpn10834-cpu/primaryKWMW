<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三角形特訓：四大屬性版</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a252f;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #f1c40f; margin-bottom: 5px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        
        #game-info {
            display: flex;
            justify-content: center;
            gap: 40px;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            padding: 10px 20px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        #timer { color: #e74c3c; font-size: 26px; }
        .time-penalty { color: #ff5252; font-size: 20px; font-weight: bold; position: absolute; animation: floatUp 1s ease-out forwards; pointer-events: none; z-index: 50; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-40px); } }

        #labels-container {
            background-color: #ecf0f1;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            min-height: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3) inset;
        }

        .draggable-label {
            padding: 12px 22px;
            background-color: #2c3e50;
            color: #ecf0f1;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: grab;
            border: 2px solid #95a5a6;
            user-select: none;
            transition: transform 0.1s;
        }
        .draggable-label:active { cursor: grabbing; transform: scale(1.05); border-color: #f1c40f; }

        #game-board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            justify-content: center;
            max-width: 1100px;
            margin: 0 auto;
        }

        .drop-zone {
            background-color: #2c3e50;
            border: 3px dashed #7f8c8d;
            border-radius: 15px;
            padding: 20px;
            height: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: all 0.2s;
        }
        .drop-zone.drag-over { background-color: #3b5998; border-color: #3498db; }
        .drop-zone.completed { border-color: #2ecc71; border-style: solid; background-color: #27ae60; }
        .drop-zone.error-flash { border-color: #e74c3c; background-color: #c0392b; }

        .shape-container {
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            margin-top: 10px;
        }

        /* 重新定義四款專屬三角形 */
        .triangle { width: 0; height: 0; transition: transform 0.3s ease; }
        /* 1. 不等邊直角 (鮮黃) */
        .tri-scalene-right { border-bottom: 70px solid #f1c40f; border-right: 120px solid transparent; } 
        /* 2. 等邊三角形 (鮮綠) */
        .tri-equi { border-left: 55px solid transparent; border-right: 55px solid transparent; border-bottom: 95px solid #2ecc71; } 
        /* 3. 等腰三角形 (亮藍) */
        .tri-iso { border-left: 35px solid transparent; border-right: 35px solid transparent; border-bottom: 110px solid #3498db; } 
        /* 4. 等腰直角 (亮紫) */
        .tri-iso-right { border-bottom: 100px solid #9b59b6; border-right: 100px solid transparent; } 
        /* 5. 一般不等邊 (湖水綠) */
        .tri-scalene { border-left: 30px solid transparent; border-right: 80px solid transparent; border-bottom: 100px solid #1abc9c; } 

        .zone-title { font-size: 1.1em; color: #bdc3c7; font-weight: bold; }
        .accepted-labels { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; justify-content: center; margin-top: auto;}
        .placed-label { padding: 5px 10px; background-color: #1a252f; color: #2ecc71; border: 1px solid #2ecc71; border-radius: 5px; font-size: 14px; font-weight: bold; }

        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex;
            justify-content: center; align-items: center; z-index: 100;
        }
        .modal { background: #ecf0f1; color: #2c3e50; padding: 40px; border-radius: 15px; text-align: center; max-width: 450px; }
        .modal h2 { margin-top: 0; color: #c0392b; font-size: 28px; }
        .btn { padding: 12px 30px; font-size: 18px; color: white; background-color: #c0392b; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; font-weight: bold;}
        .btn:hover { background-color: #e74c3c; }

    </style>
</head>
<body>

    <h1>📐 三角形特訓：四大重點版 📐</h1>

    <div id="game-info">
        <div id="level-display">關卡: 1 / 4</div>
        <div id="timer">⏳ <span id="time-left">0</span> 秒</div>
    </div>

    <div id="labels-container"></div>
    <div id="game-board"></div>

    <div id="overlay">
        <div class="modal">
            <h2 id="modal-title">集中特訓開始！</h2>
            <p id="modal-desc" style="font-size: 16px; line-height: 1.6;">
                今次淨係考：<b>等邊、等腰、直角、不等邊</b>！<br>
                💡 <span style="color:#d35400;">溫馨提示：等邊三角形一定係等腰三角形；直角都有分等腰定不等邊！</span><br>
                <b>警告：拉錯牌會即時扣 3 秒！</b>
            </p>
            <button class="btn" id="modal-btn" onclick="startGame()">接受挑戰</button>
        </div>
    </div>

    <script>
        // 刪除咗銳角同鈍角，淨係保留考試重點
        const labelDict = {
            'iso': '等腰三角形', 'equi': '等邊三角形', 
            'right': '直角三角形', 'scalene': '不等邊三角形'
        };

        const levels = [
            {
                levelNum: 1, time: 25, desc: "第一關：認清基本特徵 (小心等邊三角形隱藏屬性！)",
                labels: ['equi', 'iso', 'scalene', 'right'], // 提供四個牌
                boxes: [
                    { shape: 'tri-equi', rotation: 'rotate(15deg)', targets: ['equi', 'iso'] }, // 陷阱：等邊必定係等腰
                    { shape: 'tri-scalene', rotation: 'rotate(-10deg)', targets: ['scalene'] }
                ]
            },
            {
                levelNum: 2, time: 30, desc: "第二關：直角三角形都有分兩種！",
                labels: ['iso', 'right', 'scalene', 'equi'], 
                boxes: [
                    { shape: 'tri-iso-right', rotation: 'rotate(135deg)', targets: ['iso', 'right'] }, // 等腰直角
                    { shape: 'tri-scalene-right', rotation: 'rotate(-80deg)', targets: ['scalene', 'right'] } // 不等邊直角
                ]
            },
            {
                levelNum: 3, time: 40, desc: "第三關：三個圖形大混戰！",
                labels: ['iso', 'right', 'scalene', 'equi'],
                boxes: [
                    { shape: 'tri-iso', rotation: 'rotate(90deg)', targets: ['iso'] },
                    { shape: 'tri-scalene-right', rotation: 'rotate(-15deg)', targets: ['scalene', 'right'] },
                    { shape: 'tri-equi', rotation: 'rotate(180deg)', targets: ['equi', 'iso'] }
                ]
            },
            {
                levelNum: 4, time: 45, desc: "第四關：終極魔王！要完美分配所有屬性！",
                labels: ['iso', 'equi', 'right', 'scalene'],
                boxes: [
                    { shape: 'tri-equi', rotation: 'rotate(-60deg)', targets: ['equi', 'iso'] }, 
                    { shape: 'tri-iso-right', rotation: 'rotate(-45deg)', targets: ['iso', 'right'] },
                    { shape: 'tri-scalene', rotation: 'rotate(110deg)', targets: ['scalene'] }
                ]
            }
        ];

        let currentLevel = 0;
        let timerInterval;
        let timeLeft = 0;
        let boxesCompleted = 0;

        const overlay = document.getElementById('overlay');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const modalBtn = document.getElementById('modal-btn');
        const board = document.getElementById('game-board');
        const labelsBox = document.getElementById('labels-container');
        const timeDisplay = document.getElementById('time-left');
        const levelDisplay = document.getElementById('level-display');

        function startGame() {
            currentLevel = 0;
            loadLevel();
        }

        function loadLevel() {
            overlay.style.display = 'none'; 

            if (currentLevel >= levels.length) {
                showModal("🏆 特訓完美通關！", "太厲害喇！完全掌握晒四大三角形嘅分類，考試一定無問題！", "重新特訓", startGame);
                return;
            }

            const levelData = levels[currentLevel];
            levelDisplay.textContent = `關卡: ${levelData.levelNum} / ${levels.length}`;
            timeLeft = levelData.time;
            updateTimeDisplay();
            boxesCompleted = 0;

            board.innerHTML = '';
            labelsBox.innerHTML = '';

            // 為了增加難度，每關都會提供齊 4 款標籤
            let shuffledLabels = [...levelData.labels].sort(() => Math.random() - 0.5);

            shuffledLabels.forEach(type => {
                const label = document.createElement('div');
                label.className = 'draggable-label';
                label.draggable = true;
                label.dataset.type = type;
                label.textContent = labelDict[type];
                label.addEventListener('dragstart', dragStart);
                labelsBox.appendChild(label);
            });

            levelData.boxes.forEach((box, index) => {
                const zone = document.createElement('div');
                zone.className = 'drop-zone';
                zone.dataset.targets = box.targets.join(',');
                
                zone.innerHTML = `
                    <div class="zone-title">謎題 ${index + 1}</div>
                    <div class="shape-container">
                        <div class="triangle ${box.shape}" style="transform: ${box.rotation}"></div>
                    </div>
                    <div class="accepted-labels"></div>
                `;

                zone.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; });
                zone.addEventListener('dragenter', function(e) { e.preventDefault(); if(!this.classList.contains('completed')) this.classList.add('drag-over'); });
                zone.addEventListener('dragleave', function(e) { this.classList.remove('drag-over'); });
                zone.addEventListener('drop', dropLabel);

                board.appendChild(zone);
            });

            clearInterval(timerInterval);
            timerInterval = setInterval(timerTick, 1000);
        }

        function timerTick() {
            timeLeft--;
            updateTimeDisplay();
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                showModal("💀 時間到！", "扣秒扣得太多啦！定啲嚟，睇清楚再拉！", "重新開始", startGame);
            }
        }

        function updateTimeDisplay() {
            timeDisplay.textContent = Math.max(0, timeLeft);
        }

        function showPenalty(x, y) {
            const penalty = document.createElement('div');
            penalty.className = 'time-penalty';
            penalty.textContent = '-3秒';
            penalty.style.left = x + 'px';
            penalty.style.top = y + 'px';
            document.body.appendChild(penalty);
            setTimeout(() => penalty.remove(), 1000);
        }

        function dragStart(ev) {
            ev.dataTransfer.setData("type", ev.target.dataset.type);
            ev.dataTransfer.setData("text/plain", ev.target.textContent); 
            ev.dataTransfer.effectAllowed = "move";
        }

        function dropLabel(ev) {
            ev.preventDefault();
            const dropZone = ev.target.closest('.drop-zone');
            if (!dropZone) return;
            
            dropZone.classList.remove('drag-over');
            if (dropZone.classList.contains('completed')) return;

            const droppedType = ev.dataTransfer.getData("type");
            const droppedText = ev.dataTransfer.getData("text/plain");
            
            if (!droppedType) return; 

            const targets = dropZone.dataset.targets.split(',');
            const labelsContainer = dropZone.querySelector('.accepted-labels');
            const existing = Array.from(labelsContainer.children).map(el => el.dataset.type);

            if (targets.includes(droppedType)) {
                if (existing.includes(droppedType)) return; 

                const newLabel = document.createElement('div');
                newLabel.className = 'placed-label';
                newLabel.dataset.type = droppedType;
                newLabel.textContent = "✓ " + droppedText;
                labelsContainer.appendChild(newLabel);

                if (labelsContainer.children.length === targets.length) {
                    dropZone.classList.add('completed');
                    boxesCompleted++;
                    checkLevelClear();
                }
            } else {
                dropZone.classList.add('error-flash');
                setTimeout(() => dropZone.classList.remove('error-flash'), 300);
                
                timeLeft -= 3;
                updateTimeDisplay();
                showPenalty(ev.clientX, ev.clientY);
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    setTimeout(() => showModal("💀 扣盡時間！", "拉錯太多次啦，要睇清楚三角形嘅特徵！", "重新開始", startGame), 100);
                }
            }
        }

        function checkLevelClear() {
            if (boxesCompleted === levels[currentLevel].boxes.length) {
                clearInterval(timerInterval);
                setTimeout(() => {
                    currentLevel++;
                    if (currentLevel < levels.length) {
                        showModal(`✅ 過關！`, levels[currentLevel].desc, "挑戰下一關", loadLevel);
                    } else {
                        loadLevel();
                    }
                }, 600);
            }
        }

        function showModal(title, desc, btnText, action) {
            overlay.style.display = 'flex';
            modalTitle.textContent = title;
            modalDesc.innerHTML = desc;
            modalBtn.textContent = btnText;
            modalBtn.onclick = action;
        }
    </script>
</body>
</html>
