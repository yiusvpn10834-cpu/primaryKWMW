<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⏱️ 時空小偵探：四大時態解謎</title>
  <style>
    :root {
      --bg-color: #f4f7fe;
      --primary: #4318FF;
      --present: #05CD99;    /* Simple Present - Green */
      --present-cont: #39B8FF; /* Present Cont - Blue */
      --past: #FF8A4C;       /* Simple Past - Orange */
      --past-cont: #865CFF;    /* Past Cont - Purple */
      --text-main: #2B3674;
      --text-gray: #A3AED0;
    }
    
    * {
      box-sizing: border-box;
      font-family: 'Nunito', 'Microsoft JhengHei', sans-serif;
    }
    
    body {
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    
    .app-container {
      background: white;
      border-radius: 30px;
      box-shadow: 0 18px 40px rgba(112, 144, 176, 0.12);
      width: 100%;
      max-width: 800px;
      padding: 40px;
      overflow: hidden;
      position: relative;
    }

    /* 頂部進度與分數 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .badge {
      background: rgba(67, 24, 255, 0.1);
      color: var(--primary);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 16px;
    }
    .score-board {
      font-size: 20px;
      font-weight: 900;
      color: var(--text-main);
    }

    /* 題目區 */
    .question-area {
      text-align: center;
      margin-bottom: 40px;
    }
    .clue-hint {
      font-size: 14px;
      color: var(--text-gray);
      margin-bottom: 10px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .sentence {
      font-size: 28px;
      color: var(--text-main);
      font-weight: 800;
      line-height: 1.6;
    }
    /* 時間線索高光 */
    .keyword {
      background-color: #FEF0D9;
      color: #E28800;
      padding: 2px 10px;
      border-radius: 8px;
      border-bottom: 3px solid #F6AD55;
      cursor: help;
      transition: all 0.3s ease;
    }
    .keyword:hover {
      transform: scale(1.05);
      background-color: #FEEBC8;
    }
    /* 填空底線 */
    .blank {
      display: inline-block;
      width: 120px;
      border-bottom: 4px dashed var(--text-gray);
      margin: 0 10px;
      position: relative;
      top: -5px;
    }

    /* 選項區 */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    .option-btn {
      background: white;
      border: 2px solid #E9EDF7;
      border-radius: 20px;
      padding: 20px;
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }
    .option-btn:hover {
      border-color: var(--primary);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(67, 24, 255, 0.15);
    }

    /* 正確與錯誤狀態 */
    .option-btn.correct {
      background: var(--present);
      border-color: var(--present);
      color: white;
    }
    .option-btn.wrong {
      background: #FF5A5F;
      border-color: #FF5A5F;
      color: white;
      animation: shake 0.4s;
    }

    /* 解說面板 (Feedback) */
    .feedback-panel {
      margin-top: 30px;
      padding: 25px;
      border-radius: 20px;
      display: none;
      animation: slideUp 0.4s ease;
    }
    .feedback-panel h3 {
      margin: 0 0 10px 0;
      font-size: 20px;
    }
    .feedback-panel p {
      margin: 0;
      font-size: 16px;
      line-height: 1.5;
    }
    .next-btn {
      margin-top: 20px;
      background: var(--text-main);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 動畫 */
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-8px); }
      100% { transform: translateX(0); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 結果頁 */
    .result-screen {
      display: none;
      text-align: center;
    }
    .result-screen h1 {
      font-size: 36px;
      color: var(--primary);
    }
    .chart-container {
      display: flex;
      justify-content: space-around;
      margin: 40px 0;
    }
    .stat-box {
      background: #f4f7fe;
      padding: 20px;
      border-radius: 16px;
      width: 22%;
    }
    .stat-box h4 { margin: 0 0 10px 0; font-size: 14px; color: var(--text-gray); }
    .stat-box span { font-size: 24px; font-weight: 900; }
    
    .restart-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 15px 40px;
      border-radius: 15px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 遊戲進行區 -->
    <div id="game-screen">
      <div class="header">
        <div class="badge" id="level-indicator">Level 1 / 10</div>
        <div class="score-board">⭐ Score: <span id="score">0</span></div>
      </div>

      <div class="question-area">
        <div class="clue-hint">🔍 尋找時間線索 (Time Clue)</div>
        <div class="sentence" id="sentence-container">
          <!-- 題目會動態插入這裡 -->
        </div>
      </div>

      <div class="options-grid" id="options-container">
        <!-- 選項按鈕 -->
      </div>

      <div class="feedback-panel" id="feedback-container">
        <h3 id="feedback-title"></h3>
        <p id="feedback-text"></p>
        <button class="next-btn" onclick="nextQuestion()">Next 繼續 →</button>
      </div>
    </div>

    <!-- 結果結算區 -->
    <div id="result-screen" class="result-screen">
      <h1>🎉 偵探任務完成！</h1>
      <p style="font-size: 18px; color: #A3AED0; font-weight: bold;">這是你的四大時態分析報告</p>
      
      <div class="chart-container">
        <div class="stat-box" style="border-bottom: 4px solid var(--present)">
          <h4>Present Tense</h4>
          <span id="stat-present" style="color: var(--present)">0/0</span>
        </div>
        <div class="stat-box" style="border-bottom: 4px solid var(--present-cont)">
          <h4>Present Cont.</h4>
          <span id="stat-present-c" style="color: var(--present-cont)">0/0</span>
        </div>
        <div class="stat-box" style="border-bottom: 4px solid var(--past)">
          <h4>Past Tense</h4>
          <span id="stat-past" style="color: var(--past)">0/0</span>
        </div>
        <div class="stat-box" style="border-bottom: 4px solid var(--past-cont)">
          <h4>Past Cont.</h4>
          <span id="stat-past-c" style="color: var(--past-cont)">0/0</span>
        </div>
      </div>

      <button class="restart-btn" onclick="location.reload()">再玩一次 Play Again</button>
    </div>
  </div>

  <script>
    // 題庫設計：強調線索與時態的對應關係
    const quizData = [
      {
        tense: "present",
        sentence: "My brother <span class='blank'></span> tennis <span class='keyword' title='線索：代表日常習慣'>every Sunday</span>.",
        options: ["play", "plays", "is playing", "played"],
        answer: 1, // plays
        explanation: "【Simple Present 簡單現在式】<br>看到 <b>every Sunday (每個星期日)</b>，代表這是「日常習慣」。因為主角 My brother 是第三人稱單數 (He)，所以動詞要加 <b>s</b>。"
      },
      {
        tense: "present-cont",
        sentence: "<span class='keyword' title='線索：代表此刻正在發生'>Look!</span> The baby <span class='blank'></span> in the bedroom.",
        options: ["sleeps", "slept", "is sleeping", "was sleeping"],
        answer: 2, // is sleeping
        explanation: "【Present Continuous 現在進行式】<br>看到 <b>Look! (看啊！)</b> 或 <b>Now</b>，代表動作「此刻正在發生」。公式是 <b>is/am/are + V-ing</b>。"
      },
      {
        tense: "past",
        sentence: "We <span class='blank'></span> a funny movie <span class='keyword' title='線索：代表過去的時間'>last night</span>.",
        options: ["watch", "watches", "are watching", "watched"],
        answer: 3, // watched
        explanation: "【Simple Past 簡單過去式】<br>看到 <b>last night (昨晚)</b> 或 <b>yesterday</b>，代表事情「已經結束了」。動詞要變成過去式 (加 <b>ed</b> 或不規則變化)。"
      },
      {
        tense: "past-cont",
        sentence: "I <span class='blank'></span> a book <span class='keyword' title='線索：過去的某個精準時刻'>at 8:00 pm yesterday</span>.",
        options: ["read", "am reading", "was reading", "were reading"],
        answer: 2, // was reading
        explanation: "【Past Continuous 過去進行式】<br>看到 <b>yesterday (過去)</b> 加上 <b>at 8:00 pm (精準時間)</b>，代表在過去的那一刻「正在進行」某事。公式是 <b>was/were + V-ing</b>。"
      },
      {
        tense: "past",
        sentence: "Mary <span class='blank'></span> a piece of cake <span class='keyword' title='線索：代表過去'>two hours ago</span>.",
        options: ["eat", "eats", "ate", "is eating"],
        answer: 2, // ate
        explanation: "【Simple Past 簡單過去式】<br>看到 <b>...ago (之前)</b>，代表動作已經完成。eat 的過去式是不規則變化 <b>ate</b>！"
      },
      {
        tense: "present",
        sentence: "Water <span class='blank'></span> at 100 degrees Celsius <span class='keyword' title='線索：永遠不變的真理'>always</span>.",
        options: ["boil", "boils", "is boiling", "boiled"],
        answer: 1, // boils
        explanation: "【Simple Present 簡單現在式】<br>描述「永遠不變的事實/真理」或看到 <b>always (總是)</b>，一律使用現在式。Water 視為單數，所以加 <b>s</b>。"
      },
      {
        tense: "present-cont",
        sentence: "Please be quiet! I <span class='blank'></span> my homework <span class='keyword' title='線索：此刻正在做'>now</span>.",
        options: ["do", "did", "am doing", "was doing"],
        answer: 2, // am doing
        explanation: "【Present Continuous 現在進行式】<br>看到 <b>now (現在)</b> 或 <b>Please be quiet!</b>，代表動作此刻正在進行。配合 I，公式是 <b>am + doing</b>。"
      },
      {
        tense: "past-cont",
        sentence: "They <span class='blank'></span> football <span class='keyword' title='線索：過去發生另一件事的同時'>when it started to rain</span>.",
        options: ["play", "played", "are playing", "were playing"],
        answer: 3, // were playing
        explanation: "【Past Continuous 過去進行式】<br>當過去一件事 (started to rain) 發生時，另一件事「正在進行」，就用過去進行式。They 是眾數，所以用 <b>were + playing</b>。"
      },
      {
        tense: "past",
        sentence: "What did you <span class='blank'></span> for lunch <span class='keyword' title='線索：過去時間，且有did'>yesterday</span>?",
        options: ["have", "has", "had", "having"],
        answer: 0, // have
        explanation: "【Simple Past 陷阱題 ⚠️】<br>雖然有 yesterday，但是問句裡已經有了 <b>did</b>！「Did / Didn't」後面必須將動詞「打回原形」，所以要用回 <b>have</b>！"
      },
      {
        tense: "present-cont",
        sentence: "Listen! The birds <span class='blank'></span> beautifully in the trees <span class='keyword' title='線索：此刻發生的動作'>right now</span>.",
        options: ["sing", "sang", "is singing", "are singing"],
        answer: 3, // are singing
        explanation: "【Present Continuous 現在進行式】<br>看到 <b>Listen! (聽！)</b>，代表事情正在發生。因為 The birds 是眾數，所以公式是 <b>are + singing</b>。"
      }
    ];

    let currentQ = 0;
    let score = 0;
    let hasAnswered = false;

    // 追蹤各時態答對率
    const stats = {
      "present": { correct: 0, total: 0 },
      "present-cont": { correct: 0, total: 0 },
      "past": { correct: 0, total: 0 },
      "past-cont": { correct: 0, total: 0 }
    };

    function loadQuestion() {
      hasAnswered = false;
      const q = quizData[currentQ];
      
      document.getElementById("level-indicator").innerText = `Case ${currentQ + 1} / ${quizData.length}`;
      document.getElementById("sentence-container").innerHTML = q.sentence;
      
      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";
      
      q.options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(index, btn);
        optionsContainer.appendChild(btn);
      });

      document.getElementById("feedback-container").style.display = "none";
    }

    function checkAnswer(selectedIndex, btn) {
      if (hasAnswered) return;
      hasAnswered = true;

      const q = quizData[currentQ];
      const buttons = document.querySelectorAll(".option-btn");
      const feedbackContainer = document.getElementById("feedback-container");
      const feedbackTitle = document.getElementById("feedback-title");
      const feedbackText = document.getElementById("feedback-text");

      // 紀錄總題數
      stats[q.tense].total++;

      if (selectedIndex === q.answer) {
        btn.classList.add("correct");
        score += 10;
        document.getElementById("score").innerText = score;
        feedbackTitle.innerHTML = "✅ 推理正確！";
        feedbackTitle.style.color = "var(--present)";
        feedbackContainer.style.background = "#E6FFFA";
        feedbackContainer.style.borderLeft = "6px solid var(--present)";
        stats[q.tense].correct++;
      } else {
        btn.classList.add("wrong");
        buttons[q.answer].classList.add("correct"); // 顯示正確答案
        feedbackTitle.innerHTML = "❌ 掉進陷阱了！";
        feedbackTitle.style.color = "#E53E3E";
        feedbackContainer.style.background = "#FFF5F5";
        feedbackContainer.style.borderLeft = "6px solid #FC8181";
      }

      // 將填空底線替換成正確答案
      const blank = document.querySelector(".blank");
      if(blank) {
        blank.innerText = q.options[q.answer];
        blank.style.color = "var(--primary)";
        blank.style.borderBottom = "none";
      }

      feedbackText.innerHTML = q.explanation;
      feedbackContainer.style.display = "block";
    }

    function nextQuestion() {
      currentQ++;
      if (currentQ < quizData.length) {
        loadQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById("game-screen").style.display = "none";
      document.getElementById("result-screen").style.display = "block";

      document.getElementById("stat-present").innerText = `${stats["present"].correct}/${stats["present"].total}`;
      document.getElementById("stat-present-c").innerText = `${stats["present-cont"].correct}/${stats["present-cont"].total}`;
      document.getElementById("stat-past").innerText = `${stats["past"].correct}/${stats["past"].total}`;
      document.getElementById("stat-past-c").innerText = `${stats["past-cont"].correct}/${stats["past-cont"].total}`;
    }

    // 初始化遊戲
    loadQuestion();
  </script>
</body>
</html>
