": "word", "q": "一瓶牛奶分成 8 等份。志偉喝了 1/8，小明喝了 5/8，美恩喝了 2/8。他們共喝了幾分之幾瓶？"}, {"ans": ["2", "9"], "also": [], "hint": "7/9-5/9=2/9。", "t": "word", "q": "可兒有蘋果批 7/9 個，婉雯有蘋果批 5/9 個。可兒比婉雯多幾分之幾個？"}, {"ans": ["7", "9"], "also": [], "hint": "3/9+4/9=7/9。", "t": "word", "q": "農場有 9 隻動物，兔佔 2/9，鴨佔 4/9，雞佔 3/9。雞和鴨共佔全部動物的幾分之幾？"}, {"ans": ["7", "8"], "also": [], "hint": "1=8/8，8/8-1/8=7/8。", "t": "word", "q": "杯中有水 1 升，飲了 1/8 升，餘下多少升？"}, {"ans": ["9", "9"], "also": ["1"], "hint": "3/9+2/9+4/9=9/9。", "t": "word", "q": "哥哥分得 3/9 盒朱古力，妹妹分得 2/9 盒，弟弟分得 4/9 盒。三人共分得多少盒？"}, {"ans": ["15", "20"], "also": [], "hint": "15 人喜歡，全部 20 人，所以是 15/20。", "t": "word", "q": "一班有 20 人，其中 15 人喜歡畫畫。喜歡畫畫的人佔全班幾分之幾？"}, {"ans": ["12", "18"], "also": [], "hint": "藍色 12 粒，全部 18 粒，所以是 12/18。", "t": "word", "q": "一袋波子有 18 粒，其中 12 粒是藍色。藍色波子佔全部幾分之幾？"}, {"textAns": "3", "hint": "一打是 12 件，12 的四分之一是 3。", "t": "word", "q": "媽媽做了一打三文治，其中雞蛋三文治佔全部的 1/4。雞蛋三文治有多少件？"}, {"textAns": "8", "hint": "11-3=8。", "t": "word", "q": "王太太買了 14 對襪子，其中 3/14 是短的，11/14 是長的。短襪比長襪少多少對？"}];let mode="mixed",quiz=[],i=0,right=0,wrong=0,chosen="",wrongLog=[];
function initTabs(){document.getElementById("tabs").innerHTML=CATS.map(([id,name])=>`<button class="tab ${id===mode?'active':''}" onclick="setMode('${id}')">${name}</button>`).join("");}function setMode(m){mode=m;initTabs();restart();}function pick(){let pool=mode==="mixed"?BANK:BANK.filter(x=>x.t===mode);let n=Number(document.getElementById("limit")?.value||15);return [...pool].sort(()=>Math.random()-.5).slice(0,Math.min(n,pool.length));}function restart(){quiz=pick();i=0;right=0;wrong=0;chosen="";wrongLog=[];render();stats();}function next(){if(!quiz.length)restart();else{i=(i+1)%quiz.length;chosen="";render();stats();}}
function stats(){document.getElementById("count").textContent=quiz.length?`${i+1} / ${quiz.length}`:"0 / 0";document.getElementById("right").textContent=right;document.getElementById("wrong").textContent=wrong;const done=right+wrong;document.getElementById("rate").textContent=done?Math.round(right/done*100)+"%":"0%";document.getElementById("progress").style.width=quiz.length?((i+1)/quiz.length*100)+"%":"0%";document.getElementById("wrongList").innerHTML=wrongLog.length?wrongLog.map((x,n)=>`${n+1}. ${escapeHTML(x)}`).join("<br>"):"暫時未有錯題。";}
function render(){const q=quiz[i]||BANK[0];chosen="";document.getElementById("qtitle").textContent=q.q;document.getElementById("feedback").innerHTML="";document.getElementById("hint").classList.add("hidden");document.getElementById("hint").textContent=q.hint||"先圈關鍵字。";document.getElementById("stage").innerHTML=diagram(q);document.getElementById("answer").innerHTML=answerUI(q);}
function diagram(q){if(q.rows){let cells="";for(let n=0;n<q.rows*q.cols;n++)cells+=`<div class="cell ${q.shaded.includes(n)?'shaded':''}"></div>`;return `<div class="note">三年級：按圖直接寫，不用約分</div><div class="diagram"><div class="gridShape" style="grid-template-columns:repeat(${q.cols},1fr);grid-template-rows:repeat(${q.rows},48px)">${cells}</div></div>`;}return `<div class="diagram"><div class="note">請作答</div></div>`;}
function answerUI(q){if(q.opts)return `<div class="choices">${q.opts.map(o=>`<button class="choice" onclick="choose(this,'${jsAttr(o)}')">${escapeHTML(o)}</button>`).join("")}</div>`;if(q.order)return `答案：${q.order.map((_,idx)=>`<input id="a${idx+1}" placeholder="第${idx+1}個">`).join("，")}`;if(q.textAns)return `答案：<input id="textAns" placeholder="輸入答案">`;return `答案：<span class="fracIn"><input id="num" placeholder="分子"><span class="fracLine"></span><input id="den" placeholder="分母"></span>`;}
function choose(el,val){chosen=val;document.querySelectorAll(".choice").forEach(x=>x.classList.remove("sel"));el.classList.add("sel");}function norm(x){return String(x||"").trim().replace(/\s/g,"").replace(/[，。]/g,"").toUpperCase();}
function check(){const q=quiz[i];let ok=false;if(q.opts)ok=norm(chosen)===norm(q.ans);else if(q.order){const arr=q.order.map((_,idx)=>norm(document.getElementById("a"+(idx+1))?.value));ok=JSON.stringify(arr)===JSON.stringify(q.order.map(norm));}else if(q.textAns)ok=norm(document.getElementById("textAns")?.value)===norm(q.textAns);else{const n=norm(document.getElementById("num")?.value),d=norm(document.getElementById("den")?.value);ok=(n===norm(q.ans[0])&&d===norm(q.ans[1]))||(q.also||[]).includes(n+"/"+d)||(q.also||[]).includes(n)&&(!d||d==="1");}markChoices(q);if(ok){right++;document.getElementById("feedback").innerHTML=`<div class="feedback okText">✅ 答對！</div>`;}else{wrong++;wrongLog.push(q.q+"　答案："+correctText(q));document.getElementById("feedback").innerHTML=`<div class="feedback badText">❌ 未啱。三年級按圖直接寫分數，不用約分。</div>`;hint();}stats();}
function markChoices(q){if(!q.opts)return;document.querySelectorAll(".choice").forEach(el=>{if(norm(el.textContent)===norm(q.ans))el.classList.add("ok");else if(el.classList.contains("sel"))el.classList.add("no");});}function correctText(q){if(q.opts)return q.ans;if(q.order)return q.order.join("，");if(q.textAns)return q.textAns;if(q.ans)return q.ans[0]+"/"+q.ans[1]+((q.also||[]).length?"（亦接受："+q.also.join(" / ")+"）":"");return "";}function hint(){document.getElementById("hint").classList.remove("hidden");}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}function jsAttr(s){return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");}
function runSelfCheck(){const errors=[];BANK.forEach((q,idx)=>{if(q.opts&&!q.opts.includes(q.ans))errors.push(idx+": 選擇題答案不在選項內");if(!q.opts&&!q.textAns&&!q.ans&&!q.order)errors.push(idx+": 無答案");});document.getElementById("feedback").innerHTML=errors.length?`<div class="feedback badText">⚠️ 題庫檢查發現：<br>${errors.map(escapeHTML).join("<br>")}</div>`:`<div class="feedback okText">✅ 題庫檢查通過：共 ${BANK.length} 題；三年級版不要求最簡分數。</div>`;}
initTabs();restart();
</script></body></html>
