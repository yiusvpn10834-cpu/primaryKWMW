const TABS=[["mixed","混合"],["fill","填充題（不供詞）"],["mc","選擇題"],["第三十課","第三十課"],["第三十二課","第三十二課"],["第三十八課","第三十八課"],["第四十課","第四十課"],["延一","延一"]];let mode="mixed",quiz=[],index=0,right=0,wrong=0,selected="",wrongLog=[];function escapeHTML(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}function jsAttr(s){return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'")}function norm(s){return String(s||"").trim().replace(/[\s　，。,.！!？?、；;：「」『』“”\-—]/g,"")}function initTabs(){document.getElementById("tabs").innerHTML=TABS.map(([id,name])=>`<button class="tab ${id===mode?"active":""}" onclick="setMode('${id}')">${name}</button>`).join("")}function setMode(m){mode=m;initTabs();restart()}function pool(){if(mode==="mixed")return BANK;if(mode==="fill"||mode==="mc")return BANK.filter(q=>q.type===mode);return BANK.filter(q=>q.lesson===mode)}function restart(){const limit=Number(document.getElementById("limit").value||15);const p=pool();quiz=[...p].sort(()=>Math.random()-.5).slice(0,Math.min(limit,p.length));index=0;right=0;wrong=0;selected="";wrongLog=[];render();updateStats()}function nextQuestion(){if(!quiz.length)restart();else{index=(index+1)%quiz.length;selected="";render();updateStats()}}function render(){const q=quiz[index]||BANK[0];selected="";document.getElementById("badge").textContent=q.lesson+"｜"+(q.type==="fill"?"填充題":"選擇題");document.getElementById("qtitle").textContent=q.type==="fill"?"請在橫線上填上正確詞語。":"請選出最適合填入橫線的詞語。";document.getElementById("questionArea").innerHTML=`<div class="sentence">${escapeHTML(q.sentence)}</div>`;document.getElementById("hint").textContent="提示："+q.hint;document.getElementById("hint").classList.add("hidden");document.getElementById("feedback").innerHTML="";if(q.type==="fill"){document.getElementById("answerArea").innerHTML=`答案：<input id="answerInput" autocomplete="off" placeholder="輸入詞語">`;setTimeout(()=>document.getElementById("answerInput")?.focus(),50)}else{document.getElementById("answerArea").innerHTML="";document.getElementById("questionArea").innerHTML+=`<div class="choices">${q.choices.map(c=>`<button class="choice" onclick="choose(this,'${jsAttr(c)}')">${escapeHTML(c)}</button>`).join("")}</div>`}}function choose(el,val){selected=val;document.querySelectorAll(".choice").forEach(x=>x.classList.remove("selected"));el.classList.add("selected")}function acceptedAnswers(q){return [q.answer].concat(q.variants||[])}function check(){const q=quiz[index];let ok=false;if(q.type==="fill"){const ans=norm(document.getElementById("answerInput")?.value);ok=acceptedAnswers(q).map(norm).includes(ans)}else{ok=norm(selected)===norm(q.answer)}if(q.type==="mc"){document.querySelectorAll(".choice").forEach(el=>{if(norm(el.textContent)===norm(q.answer))el.classList.add("correct");else if(el.classList.contains("selected"))el.classList.add("wrong")})}if(ok){right++;document.getElementById("feedback").innerHTML=`<div class="feedback ok">✅ 答對！</div>`}else{wrong++;wrongLog.push(`${q.lesson}｜${q.type==="fill"?"填充題":"選擇題"}｜${q.sentence}　答案：${q.answer}`);document.getElementById("feedback").innerHTML=`<div class="feedback no">❌ 未啱，答案是：${escapeHTML(q.answer)}</div>`;showHint()}updateStats()}function showHint(){document.getElementById("hint").classList.remove("hidden")}function updateStats(){const total=quiz.length||0;document.getElementById("count").textContent=total?`${index+1} / ${total}`:"0 / 0";document.getElementById("right").textContent=right;document.getElementById("wrong").textContent=wrong;const done=right+wrong;document.getElementById("rate").textContent=done?Math.round(right/done*100)+"%":"0%";document.getElementById("progress").style.width=total?((index+1)/total*100)+"%":"0%";document.getElementById("wrongList").innerHTML=wrongLog.length?wrongLog.map((x,i)=>`${i+1}. ${escapeHTML(x)}`).join("<br>"):"暫時未有錯題。"}function runSelfCheck(){const errors=[];BANK.forEach((q,i)=>{if(!q.lesson||!q.type||!q.answer||!q.sentence)errors.push(i+"：資料不完整");if(q.type==="mc"){if(!q.choices||!q.choices.includes(q.answer))errors.push(i+"：選擇題答案不在選項內");if(new Set(q.choices).size!==q.choices.length)errors.push(i+"：選項重複")}});if(errors.length){document.getElementById("feedback").innerHTML=`<div class="feedback no">⚠️ 題庫檢查發現問題：<br>${errors.map(escapeHTML).join("<br>")}</div>`}else{document.getElementById("feedback").innerHTML=`<div class="feedback ok">✅ 題庫檢查通過：共 ${BANK.length} 題。</div>`}}document.addEventListener("keydown",e=>{if(e.key==="Enter")check()});initTabs();restart();</script></body></html>
