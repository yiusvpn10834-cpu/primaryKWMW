r-width:3px;border-radius:20px;gap:8px}.sidebar{display:flex;gap:4px;padding:5px;border-width:2px;overflow-x:auto;border-radius:13px}.side-title{display:none}.stage-btn{flex:0 0 auto;width:90px;min-height:43px;margin:0;border-radius:10px;font-size:11px;padding:4px}.stage-btn .number{font-size:16px}.heading h1{font-size:23px;padding:5px}.stat{font-size:14px;padding:5px}.instructions{margin:7px 0;font-size:15px}.playfield{min-height:277px;padding:8px}.sideinfo{gap:7px}.combo,.objectives{padding:6px;border-radius:14px}.combo h2{font-size:15px}.combo p,.objectives p{font-size:13px;margin:4px}.objectives h2{font-size:15px;margin:2px}.controls{margin-top:9px;gap:7px}.action{min-width:0;font-size:16px;border-width:2px;border-radius:15px;padding:9px 4px}.emoji{font-size:25px}.feedback{font-size:15px}.garden-note{font-size:12px}.plant-icon{font-size:50px}.pot{font-size:43px}.pot-label{font-size:13px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head><body><div class="shell"><header class="top"><div class="banner" role="img" aria-label="小小園藝師闖關挑戰，卡通園丁與花園"></div><div class="best">🏆 最高分<b id="best">0</b></div></header>
<div class="board"><aside class="sidebar" id="stages"><div class="side-title">🌿 關卡 🌿</div></aside><main class="main"><div class="heading"><h1 id="title">關卡 1　種植任務</h1><div class="stats"><div class="stat">⭐ 得分 <span id="score">0</span></div><div class="stat">⏱️ 時間 <span id="time">00:45</span></div></div></div><p class="instructions" id="instructions">依次完成播種 → 澆水 → 陽光，令植物快高長大！</p><div class="playrow"><div class="playfield" id="field"><div class="scene" id="scene"></div></div><div class="sideinfo"><div class="combo"><h2>🔥 連擊獎勵</h2><p id="combo">連續正確 +10 分！</p></div><div class="objectives"><h2>🎯 目標</h2><div id="objectives"></div></div></div></div><div class="controls" id="controls"></div><div class="feedback" id="feedback" aria-live="polite"></div></main></div><div class="foot">🌻 一人遊戲・適合小一至小二・點按操作・挑戰最高分！</div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);const names=['種植任務','捉蟲保衛','限時澆水','園藝小測驗','收成挑戰'];const icons=['🌱','🐛','💧','🧠','🍅'];let level=0,unlocked=0,finished=[false,false,false,false,false],score=0,best=0,seconds=45,running=false,timer=null,combo=0,progress=0,target=-1,animal='';let questions=[],qi=0;
try{best=Number(localStorage.getItem('garden_hero_best')||0)||0}catch(e){}$('best').textContent=best;
const qs=[['植物需要甚麼？',['陽光和水 ☀️💧','汽水 🥤','糖果 🍬','玩具 🧸'],0],['泥土仍然濕潤，應該點做？',['再澆好多水','暫時唔澆水','拔起植物','加汽水'],1],['發現葉上有蟲，應該點做？',['立即亂噴藥','先觀察，告訴老師','踩爛植物','摘晒所有葉'],1],['種子發芽通常先長出甚麼？',['小葉 🌱','蘋果 🍎','石頭 🪨','膠袋'],0],['收成蔬菜前，應該點做？',['問老師可否採摘','隨便拔走','亂丟菜葉','用腳踢'],0]];
const fmt=t=>`00:${String(Math.max(0,t)).padStart(2,'0')}`;
function save(){if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem('garden_hero_best',String(best))}catch(e){}}}
function add(n){score=Math.max(0,score+n);$('score').textContent=score;save();if(n>0){combo++;$('combo').textContent=combo>=3?`🔥 ${combo} 連擊！太叻啦！`:'答啱 +10 分！';if(combo>0&&combo%3===0){score+=10;$('score').textContent=score;save();$('feedback').textContent='🔥 三連擊！額外 +10 分！';}}else{combo=0;$('combo').textContent='再試一次！'}}
function message(s){$('feedback').textContent=s}
function objectives(items){$('objectives').replaceChildren();items.forEach((x,i)=>{const p=document.createElement('p');p.textContent=(i<progress?'✅ ':i===progress?'🟨 ':'☐ ')+x;$('objectives').appendChild(p)})}
function button(txt,fn,variant=''){const b=document.createElement('button');b.type='button';b.className='action '+variant;const space=txt.indexOf(' ');if(space>0){const a=document.createElement('span');a.className='emoji';a.textContent=txt.slice(0,space);b.append(a,document.createTextNode(txt.slice(space+1)))}else b.textContent=txt;b.addEventListener('click',fn);return b}
function controls(...bs){$('controls').replaceChildren(...bs)}
function setScene(content){$('scene').replaceChildren();if(typeof content==='string')$('scene').innerHTML=content;else $('scene').append(content)}
function heading(){const el=$('stages');el.querySelectorAll('.stage-btn').forEach(e=>e.remove());names.forEach((name,i)=>{const b=document.createElement('button');b.type='button';b.className='stage-btn '+(i===level?'active':finished[i]?'done':'');b.innerHTML=`<span class="number">${i>unlocked?'🔒':finished[i]?'✅':icons[i]}</span><span>${i+1} ${name}</span>`;b.disabled=i>unlocked;b.onclick=()=>load(i);el.append(b)});$('title').textContent=`關卡 ${level+1}　${names[level]}`;}
function stop(){running=false;clearInterval(timer);timer=null}
function startClock(n){stop();seconds=n;$('time').textContent=fmt(seconds);running=true;timer=setInterval(()=>{seconds--;$('time').textContent=fmt(seconds);if(seconds<=0){stop();endStage(false)}},1000)}
function endStage(done){stop();if(done){finished[level]=true;unlocked=Math.max(unlocked,Math.min(4,level+1));add(20)}heading();$('instructions').textContent=done?'🏆 完成挑戰！':'⏰ 時間到！再試一次！';const div=document.createElement('div');div.className='end';const h=document.createElement('h2');h.textContent=done?'🎉 關卡完成！':'⏰ 挑戰結束！';const cup=document.createElement('div');cup.className='cup';cup.textContent=done?'🏆':'🌱';const p=document.createElement('p');p.textContent=done?`目前總分 ${score} 分，繼續闖關！`:`目前總分 ${score} 分，再挑戰可以更高分！`;div.append(h,cup,p);setScene(div);message(done?'⭐ 過關獎勵 +20 分！':'💪 繼續努力！');if(level===4&&done){controls(button('🔄 重新挑戰',reset,'green'));$('instructions').textContent='恭喜你成為小小園藝王者！';}else controls(button('🔄 再試一次',()=>load(level)),...(done?[button('➡️ 下一關',()=>load(level+1),'green')]:[]));}
function load(i){if(i>unlocked)return;stop();level=i;progress=0;combo=0;$('combo').textContent='連續正確 +10 分！';message('');heading();$('time').textContent='00:45';if(i===0)plant();if(i===1)pests();if(i===2)water();if(i===3)quiz();if(i===4)harvest()}
function plant(){const steps=['播種','澆水','曬太陽'];const art=['🌰','🌱','🌿','🌻'];$('instructions').textContent='依次完成播種 → 澆水 → 陽光，令植物快高長大！';function draw(){const n=Math.min(3,progress);setScene(`<div class="pots">${[0,1,2].map((j)=>`<div class="plant-card ${j===n-1?'selected':''}"><div class="plant-icon">${art[Math.min(n,j+1)]}</div><div class="pot">🪴</div><div class="pot-label">${['種子','發芽','長大'][j]}</div></div>`).join('')}</div><div class="garden-note">${['🌰 等待播種','🌱 種子開始發芽','🌿 小苗健康成長','🌻 植物長大啦！'][n]}</div>`);objectives(steps);if(n<3){const labels=['🌰 播種','💧 澆水','☀️ 曬太陽'];controls(...labels.map((s,j)=>{let b=button(s,()=>{if(j!==progress){message('💡 請按正確次序完成任務！');combo=0;return}progress++;add(10);message(['播種成功！','澆水成功！','有陽光，植物快高長大！'][j]);if(progress===3)endStage(true);else draw()},j===1?'blue':j===2?'green':'');b.disabled=j!==progress;return b}))}}draw();startClock(45)}
function pests(){progress=0;$('instructions').textContent='25 秒內捉毛毛蟲 🐛，唔好捉蜜蜂 🐝 同瓢蟲 🐞！';objectives(['捉到 6 條毛毛蟲','唔好誤捉益蟲']);function spawn(){if(!running)return;target=Math.floor(Math.random()*9);animal=Math.random()<.68?'🐛':Math.random()<.5?'🐝':'🐞';const grid=document.createElement('div');grid.className='tiles';for(let i=0;i<9;i++){const b=document.createElement('button');b.className='tile';b.textContent=i===target?animal:'🌱';b.setAttribute('aria-label',i===target?animal:'植物');b.onclick=()=>{if(!running||i!==target)return;if(animal==='🐛'){progress++;add(10);message('✅ 捉到毛毛蟲！');if(progress>=6){endStage(true);return}}else{add(-5);message('💚 益蟲可以幫助花園，唔好捉佢！')}objectives(['捉到 6 條毛毛蟲','唔好誤捉益蟲']);spawn()};grid.append(b)}setScene(grid)}controls(button('🐛 捉 6 條過關',()=>{},'green'));$('controls').replaceChildren();startClock(25);spawn();const auto=setInterval(()=>{if(level!==1||!running){clearInterval(auto);return}spawn()},1350)}
function water(){progress=0;let count=0;$('instructions').textContent='觀察泥土，只有乾燥嘅盆栽先需要澆水！';const seq=['乾','濕','乾','乾','濕','乾','濕','乾'];function draw(){if(!running)return;const dry=seq[count]==='乾';setScene(`<div style="font-size:80px">${dry?'🥀':'🌿'}</div><div class="question">泥土${dry?'乾燥了 🟤':'仍然濕潤 💦'}，應該點做？</div>`);objectives([`答對 ${count} / 8 題`]);controls(button('💧 澆水',()=>answer(true),'blue'),button('✋ 暫不澆水',()=>answer(false),'green'))}function answer(yes){if(!running)return;const correct=(seq[count]==='乾')===yes;if(correct){add(10);message('✅ 做得好！你識得觀察泥土。')}else{add(-5);message('💡 澆水前先檢查泥土！')}count++;progress=count;if(count>=8){endStage(true);return}draw()}startClock(35);draw()}
function quiz(){qi=0;progress=0;questions=[...qs];$('instructions').textContent='答啱園藝知識題目！答錯可以再試。';function draw(){if(!running)return;const [q,answers]=questions[qi];const wrap=document.createElement('div');const h=document.createElement('div');h.className='question';h.textContent=`第 ${qi+1} / ${questions.length} 題：${q}`;const choices=document.createElement('div');choices.className='choice-tiles';answers.forEach((a,j)=>{const b=document.createElement('button');b.className='choice';b.textContent=a;b.onclick=()=>{if(!running)return;if(j===questions[qi][2]){add(10);qi++;progress=qi;message('✅ 答啱啦！');if(qi===questions.length){endStage(true);return}draw()}else{add(-5);message('💡 唔係呢個答案，再試吓！')}};choices.append(b)});wrap.append(h,choices);setScene(wrap);objectives([`答啱 ${qi} / ${questions.length} 題`])}controls();startClock(45);draw()}
function harvest(){progress=0;$('instructions').textContent='只摘成熟紅番茄 🍅，唔好摘未成熟青番茄！';function spawn(){if(!running)return;const grid=document.createElement('div');grid.className='tiles';const ripe=new Set();while(ripe.size<3)ripe.add(Math.floor(Math.random()*9));for(let i=0;i<9;i++){const b=document.createElement('button');b.className='tile';b.textContent=ripe.has(i)?'🍅':'🟢';b.setAttribute('aria-label',ripe.has(i)?'成熟紅番茄':'未成熟青番茄');b.onclick=()=>{if(!running)return;if(ripe.has(i)){progress++;add(10);message('🍅 成功收成成熟番茄！');if(progress>=8){endStage(true);return}}else{add(-5);message('🌱 青番茄未成熟，等佢變紅先摘！')}objectives([`摘到 ${progress} / 8 個成熟番茄`]);spawn()};grid.append(b)}setScene(grid)}controls();startClock(30);objectives(['摘到 0 / 8 個成熟番茄']);spawn()}
function reset(){stop();score=0;$('score').textContent=0;finished=[false,false,false,false,false];unlocked=0;load(0)}
load(0);
})();
</script></body></html>
