<title>English Exam Sprint Edition</title>
<style>
:root{

*{box-sizing:border-box}
body{margin:0;padding:16px;font-family:Arial,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:radial-gradient(circle at top left,#fff8e8 0,transparent 35%),radial-gradient(circle at bottom right,#e7f7f6 0,transparent 35%),linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));color:var(--ink)}
.app{max-width:1240px;margin:auto;background:rgba(255,253,248,.96);border:2px solid #e6dccd;border-radius:28px;padding:18px;box-shadow:0 16px 40px #00000018}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid #eadfce;padding-bottom:12px}
h1{font-size:32px;margin:0;color:#35413b}
.sub{color:var(--muted);font-size:17px;margin-top:5px}
.logo{width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,var(--tea),var(--aqua));display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:inset 0 0 0 4px #fff8;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}
.stat{border:2px solid #d6cdbf;border-radius:18px;text-align:center;padding:10px;background:#fff;box-shadow:0 4px 12px #0000000b;font-size:16px}
.stat b{font-size:26px;color:#35524a}
.menu{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}
button{border:2px solid var(--line);border-radius:16px;background:white;padding:12px 12px;font-size:17px;font-weight:800;box-shadow:3px 3px 0 var(--line);cursor:pointer;color:var(--ink);font-family:inherit}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.active{background:#dff2f2}
.card{border:2px solid #dfd5c8;border-radius:24px;padding:16px;background:#fff;min-height:520px;box-shadow:0 5px 18px #00000010}
.story{background:#f8f1df;border-left:8px solid var(--tea);border-radius:16px;padding:13px 14px;font-size:21px;line-height:1.45;margin-bottom:12px}
.question{text-align:center;font-size:32px;color:#33443f;font-weight:900;margin:20px 0;line-height:1.35}
.hint{text-align:center;font-size:19px;color:var(--muted);margin:6px 0 14px}
.options{display:grid;gap:12px;max-width:980px;margin:auto}
.option{font-size:22px;text-align:left;line-height:1.4;background:white}
.good{background:var(--good)!important}.bad{background:var(--bad)!important}
.feedback{min-height:48px;text-align:center;font-size:24px;font-weight:900;margin:12px;color:#365e57}
.wordbank{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.pill{border:2px solid #b9d5d3;border-radius:999px;padding:8px 13px;background:#eff8f7;font-size:18px;font-weight:800;color:#415753}
.wrongbox{margin-top:14px;border:2px solid #d0c7df;border-radius:18px;background:#faf8ff;padding:12px;font-size:16px;max-height:150px;overflow:auto}
.small{font-size:17px;color:var(--muted);line-height:1.45}
.toolbar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.report{margin-top:12px;padding:12px;background:#f5faf8;border:2px solid #b9d5d3;border-radius:16px;font-size:17px;line-height:1.6}

 simple_past:"Use past tense for yesterday / last birthday / last Sunday.",
 irregular:"Some verbs do not add -ed: eat → ate, give → gave, take → took.",
 object_pronouns:"Example: She talks to me. I like him. They help us.",
 prepositions:"Look at the position carefully before choosing.",
 proofreading:"Look for tense, pronoun, -ing and subject-verb agreement.",
 reading:"Look for keywords: venue, price, chapter, page, rhyme, days and time.",
 writing:"Use examples to support ideas. This helps score higher."
};
function render(q,label){
 story.textContent=storyText[label]||"Boss Challenge: mixed questions.";
 question.textContent=q.q; hint.textContent=hintText[label]||"Read carefully before choosing.";
 wordbank.innerHTML="<span class='pill'>Mode: "+label.replaceAll('_',' ')+"</span><span class='pill'>Tap the best answer</span>";
 options.innerHTML="";
 shuffle(q.opts).forEach(o=>{
  const b=document.createElement("button"); b.className="option"; b.textContent=o;
  b.onclick=()=>choose(b,o===q.a,label+" | "+q.q+" | Answer: "+q.a, q, label);
  options.appendChild(b);
 });
}
function nextQuestion(){
 document.getElementById("report").style.display="none";
 feedback.textContent=""; options.innerHTML="";
 let actual=mode==="boss"?shuffle(Object.keys(DATA))[0]:mode;
 const arr=DATA[actual]; const q=arr[Math.floor(Math.random()*arr.length)];
 render(q,actual);
}
function choose(btn,ok,wrongText,q,label){
 total++;
 if(ok){scoreVal+=10;correctVal++;modeStats[label].c++;btn.classList.add("good");feedback.textContent="Correct! +10";}
 else{wrongVal++;modeStats[label].w++;btn.classList.add("bad");wrongItems.push(wrongText);wrongPool.push({q:q,label:label});feedback.textContent="Almost! Added to wrong questions.";}
 refresh();
}
function reviewWrong(){
 if(!wrongPool.length){feedback.textContent="No wrong questions to review yet.";return;}
 const item=wrongPool.shift(); render(item.q,item.label); feedback.textContent="Wrong question review.";
}
function resetGame(){
 scoreVal=0;correctVal=0;wrongVal=0;total=0;wrongItems=[];wrongPool=[];
 Object.keys(DATA).forEach(k=>modeStats[k]={c:0,w:0});
 refresh();nextQuestion();
}
function showReport(){
 let lines=["<b>Exam Sprint Report</b>"];
 Object.keys(modeStats).forEach(k=>{
   const c=modeStats[k].c,w=modeStats[k].w,t=c+w;
   if(t>0) lines.push(k.replaceAll('_',' ') + ": " + Math.round(c/t*100) + "% ("+c+"/"+t+")");
 });
 if(lines.length===1) lines.push("Do a few questions first, then come back to see the report.");
 const weak=Object.keys(modeStats).filter(k=>modeStats[k].c+modeStats[k].w>0 && modeStats[k].c/(modeStats[k].c+modeStats[k].w)<0.7);
 if(weak.length) lines.push("<br><b>Needs More Practice:</b><br>" + weak.map(x=>"✓ "+x.replaceAll('_',' ')).join("<br>"));
 report.innerHTML=lines.join("<br>");
 report.style.display="block";
}
refresh();nextQuestion();
</script>
</body>
