<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>容量互動練習</title>
<style>

  *{box-sizing:border-box}
  body{margin:0;background:#fffaf3;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}
  .app{max-width:1080px;margin:18px auto;padding:18px;border:3px solid #111;border-radius:22px;background:white}
  h1{margin:4px 0 10px;text-align:center;font-size:30px;letter-spacing:.08em}
  .tabs,.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .tab,.btn{border:3px solid #111;border-radius:16px;background:white;padding:10px 18px;font-weight:800;font-size:18px;cursor:pointer;box-shadow:0 3px 0 #111}
  .tab.active{background:#cfe8ff}.btn.main{background:#dcfce7}.btn.warn{background:#fff7ed}
  .btn:active,.tab:active{transform:translateY(2px);box-shadow:0 1px 0 #111}
  .progressWrap{height:22px;border:3px solid #111;border-radius:999px;overflow:hidden;margin:10px 0 18px;background:white}
  .progress{height:100%;width:0;background:#86efac}
  .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:15px;margin-bottom:8px;color:#4b5563}
  .qtitle{font-size:26px;font-weight:900;line-height:1.45;margin:12px 0 18px}
  .stage{border:3px solid #111;border-radius:18px;padding:18px;min-height:230px;background:#fff;margin-bottom:18px}
  .diagram{display:flex;justify-content:center;align-items:center;min-height:170px;width:100%;gap:16px;flex-wrap:wrap}
  .cupRow{display:flex;align-items:flex-end;gap:16px;justify-content:center;flex-wrap:wrap}
  .cupWrap{text-align:center;font-weight:800}
  .capLabel{font-size:18px;margin-bottom:4px}
  .measureWrap{display:flex;align-items:stretch;gap:8px;justify-content:center}
  .scale{position:relative;width:56px;height:150px;font-size:12px;color:#111;font-weight:800}
  .scaleLine{position:absolute;right:0;width:20px;border-top:2px solid #111}
  .scaleLine.small{width:11px}
  .scaleLabel{position:absolute;right:24px;transform:translateY(-50%);white-space:nowrap;font-size:12px}
  .cup{width:100px;height:150px;border:3px solid #111;border-top:5px solid #111;border-radius:4px 4px 13px 13px;position:relative;background:#fff;margin:0 auto 6px;overflow:hidden}
  .water{position:absolute;bottom:0;left:0;right:0;background:var(--water);background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.10) 0,rgba(0,0,0,.10) 4px,transparent 4px,transparent 10px)}
  .ticks{position:absolute;left:0;top:0;right:0;bottom:0}
  .tick{position:absolute;left:0;width:20px;border-top:2px solid #111}
  .tick.small{width:11px}
  .objectBox{display:flex;align-items:center;justify-content:center;border:3px solid #111;border-radius:16px;padding:16px;min-width:130px;min-height:110px;background:#fff;font-size:48px;text-align:center;font-weight:900}
  .arrow{font-size:34px;font-weight:900}
  .cupIcon{display:inline-flex;align-items:center;justify-content:center;width:44px;height:54px;border:3px solid #111;border-radius:5px 5px 12px 12px;margin:2px;background:#fff}
  .iconGroup{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:340px}
  .labelCard{font-size:24px;font-weight:900;text-align:center}
  .choiceGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;width:100%}
  .choice{border:3px solid #111;border-radius:14px;padding:14px;font-size:22px;font-weight:800;background:white;cursor:pointer;text-align:center}
  .choice.sel{background:#dbeafe}.choice.ok{background:#dcfce7}.choice.no{background:#fee2e2}
  .answer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:24px;margin:8px 0}
  input,select{border:3px solid #111;border-radius:12px;padding:10px;font-size:22px;text-align:center;background:white}
  input{width:135px} select{font-weight:800}
  .feedback{font-size:22px;font-weight:900;margin:10px 0}.okText{color:#15803d}.badText{color:#b91c1c}
  .hint{border:3px dashed #f59e0b;background:var(--yellow);border-radius:16px;padding:14px;font-size:20px;line-height:1.55;margin-top:10px}
  .hidden{display:none}.wrongBox{border-top:2px solid #e5e7eb;margin-top:14px;padding-top:12px;font-size:16px;line-height:1.6}
  .formula{font-size:30px;font-weight:900;text-align:center;margin:16px 0}.small{font-size:16px;color:#4b5563}
  @media(max-width:640px){.app{margin:0;border:0;border-radius:0}.qtitle{font-size:22px}.tab,.btn{font-size:16px;padding:9px 12px}.cup{width:82px;height:126px}.scale{height:126px}.objectBox{font-size:38px;min-width:108px}}
</style>
</head>
<body>
<div class="app">

        <option value="30">30</option>

  <div class="stage" id="stage"></div>
  <div class="answer" id="answer"></div>

    <button class="btn" onclick="hint()">提示</button>
    <button class="btn" onclick="next()">下一題</button>
    <button class="btn" onclick="restart()">重新出題</button>

  <div id="feedback"></div>
  <div id="hint" class="hint hidden"></div>
  <div class="wrongBox"><b>錯題紀錄：</b><div id="wrongList">暫時未有錯題。</div></div>
</div>

let mode="mixed", quiz=[], i=0, right=0, wrong=0, chosen="", wrongLog=[];

function initTabs(){document.getElementById("tabs").innerHTML=CATS.map(([id,name])=>`<button class="tab ${id===mode?'active':''}" onclick="setMode('${id}')">${name}</button>`).join("");}
function setMode(m){mode=m;initTabs();restart();}
function pick(){let pool=mode==="mixed"?BANK:BANK.filter(x=>x.t===mode);let n=Number(document.getElementById("limit")?.value||15);return [...pool].sort(()=>Math.random()-.5).slice(0,Math.min(n,pool.length));}
function restart(){quiz=pick();i=0;right=0;wrong=0;chosen="";wrongLog=[];render();stats();}
function next(){if(!quiz.length)restart();else{i=(i+1)%quiz.length;chosen="";render();stats();}}
function stats(){
  document.getElementById("count").textContent=quiz.length?`${i+1} / ${quiz.length}`:"0 / 0";
  document.getElementById("right").textContent=right; document.getElementById("wrong").textContent=wrong;
  const done=right+wrong; document.getElementById("rate").textContent=done?Math.round(right/done*100)+"%":"0%";
  document.getElementById("progress").style.width=quiz.length?((i+1)/quiz.length*100)+"%":"0%";
  document.getElementById("wrongList").innerHTML=wrongLog.length?wrongLog.map((x,n)=>`${n+1}. ${escapeHTML(x)}`).join("<br>"):"暫時未有錯題。";
}
function render(){
  const q=quiz[i]||BANK[0]; chosen="";
  document.getElementById("qtitle").textContent=q.q;
  document.getElementById("feedback").innerHTML="";
  document.getElementById("hint").classList.add("hidden"); document.getElementById("hint").textContent=q.h||"先圈關鍵字，再統一單位。";
  document.getElementById("stage").innerHTML=diagram(q);
  document.getElementById("answer").innerHTML=answerUI(q);
}
function cupHTML(c){
  const cap=c.cap,val=c.val,pct=Math.max(0,Math.min(100,val/cap*100)),divisions=10,step=c.step||(cap/divisions);
  let scale="",ticks="";
  for(let k=0;k<=divisions;k++){
    const y=100-(k/divisions*100), labelVal=k*step;
    scale += `<span class="scaleLine" style="top:${y}%"></span><span class="scaleLabel" style="top:${y}%">${labelVal}</span>`;
    ticks += `<span class="tick" style="top:${y}%"></span>`;
    if(k<divisions){const ym=100-((k+0.5)/divisions*100);scale+=`<span class="scaleLine small" style="top:${ym}%"></span>`;ticks+=`<span class="tick small" style="top:${ym}%"></span>`;}
  }
  return `<div class="cupWrap"><div class="capLabel">${c.label?escapeHTML(c.label)+"　":""}${escapeHTML(c.top||cap+" mL")}</div><div class="measureWrap"><div class="scale">${scale}</div><div class="cup"><div class="ticks">${ticks}</div><div class="water" style="height:${pct}%"></div></div></div>${c.label?`<div>${escapeHTML(c.label)}</div>`:""}</div>`;
}
function cups(n){return `<div class="iconGroup">${Array.from({length:n},()=>`<span class="cupIcon"></span>`).join("")}</div>`}
function diagram(q){
  if(q.cup)return `<div class="diagram">${cupHTML(q.cup)}</div>`;
  if(q.cups)return `<div class="diagram cupRow">${q.cups.map(cupHTML).join("")}</div>`;
  if(q.visualCups)return `<div class="diagram">${q.visualCups.map(([name,n],idx)=>`<div class="objectBox"><div><div class="labelCard">${escapeHTML(name)}</div><div style="font-size:20px">剛好倒滿 ${n} 個杯子</div>${cups(n)}</div></div>${idx<q.visualCups.length-1?'<div class="arrow">比較</div>':''}`).join("")}</div>`;
  if(q.t==="convert")return `<div class="formula">1 L = 1000 mL</div><div class="small" style="text-align:center">記得補零：例如 2 L 19 mL = 2019 mL。</div>`;
  if(q.t==="unit")return `<div class="diagram"><div class="objectBox">${escapeHTML(q.icon||"💧")}</div></div>`;
  if(q.t==="tool")return `<div class="diagram"><div class="objectBox">💧</div><div class="arrow">用咩量度？</div><div class="objectBox">💉 / 量杯 / 水桶</div></div>`;
  if(q.t==="compare")return `<div class="diagram"><div class="objectBox">容器 A</div><div class="arrow">倒水</div><div class="objectBox">容器 B</div></div>`;
  return `<div class="diagram"><div class="objectBox">💧</div><div class="arrow">容量</div><div class="objectBox">🥤</div></div>`;
}
function answerUI(q){
  if(q.opts)return `<div class="choiceGrid">${q.opts.map(o=>`<button class="choice" onclick="choose(this,'${jsAttr(o)}')">${escapeHTML(o)}</button>`).join("")}</div>`;
  if(q.order)return `答案：<input id="a1" placeholder="第1個"><input id="a2" placeholder="第2個"><input id="a3" placeholder="第3個">`;
  if(q.splitAns)return `答案：<input id="s1" placeholder="L"> L　<input id="s2" placeholder="mL"> mL`;
  return `答案：<input id="textAns" placeholder="輸入答案"> ${q.unit?`<b>${escapeHTML(q.unit)}</b>`:""}`;
}
function choose(el,val){chosen=val;document.querySelectorAll(".choice").forEach(x=>x.classList.remove("sel"));el.classList.add("sel");}
function norm(x){return String(x||"").trim().replace(/\s/g,"").replace(/[，。]/g,"").toUpperCase();}
function numNorm(x){return norm(x).replace("１","1").replace("２","2").replace("３","3").replace("４","4").replace("５","5").replace("６","6").replace("７","7").replace("８","8").replace("９","9").replace("０","0");}
function check(){
  const q=quiz[i];let ok=false;
  if(q.opts)ok=norm(chosen)===norm(q.ans);
  else if(q.order){const arr=[1,2,3].map(n=>norm(document.getElementById("a"+n)?.value)).filter(Boolean);ok=JSON.stringify(arr)===JSON.stringify(q.order.map(norm));}
  else if(q.splitAns)ok=numNorm(document.getElementById("s1")?.value)===numNorm(q.splitAns[0])&&numNorm(document.getElementById("s2")?.value)===numNorm(q.splitAns[1]);
  else ok=numNorm(document.getElementById("textAns")?.value)===numNorm(q.textAns);
  markChoices(q);
  if(ok){right++;document.getElementById("feedback").innerHTML=`<div class="feedback okText">✅ 答對！</div>`;}
  else{wrong++;wrongLog.push(q.q+"　答案："+correctText(q));document.getElementById("feedback").innerHTML=`<div class="feedback badText">❌ 未啱，先睇清楚問咩，再統一單位。</div>`;hint();}
  stats();
}
function markChoices(q){if(!q.opts)return;document.querySelectorAll(".choice").forEach(el=>{if(norm(el.textContent)===norm(q.ans))el.classList.add("ok");else if(el.classList.contains("sel"))el.classList.add("no");});}
function correctText(q){if(q.opts)return q.ans;if(q.order)return q.order.join("，");if(q.splitAns)return q.splitAns[0]+" L "+q.splitAns[1]+" mL";return q.textAns+(q.unit?" "+q.unit:"");}
function hint(){document.getElementById("hint").classList.remove("hidden");}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function jsAttr(s){return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");}
function runSelfCheck(){
  const errors=[];
  BANK.forEach((q,idx)=>{
    if(!q.t||!q.q)errors.push(idx+": 缺少類別或題目");
    if(q.opts && !q.opts.includes(q.ans))errors.push(idx+": 選擇題答案不在選項內");
    if(!q.opts && !q.textAns && !q.splitAns && !q.order)errors.push(idx+": 沒有答案欄位");
    if(q.splitAns && q.splitAns.length!==2)errors.push(idx+": 換算題答案格式錯");
    if(q.cup && !(q.cup.val<=q.cup.cap))errors.push(idx+": 量杯水位大於容量");
    if(q.cups)q.cups.forEach((c,j)=>{if(c.val>c.cap)errors.push(idx+": 第"+j+"個量杯水位大於容量");});
  });
  document.getElementById("feedback").innerHTML = errors.length
    ? `<div class="feedback badText">⚠️ 題庫檢查發現：<br>${errors.map(escapeHTML).join("<br>")}</div>`
    : `<div class="feedback okText">✅ 題庫結構檢查通過：共 ${BANK.length} 題。</div>`;
}
initTabs();restart();
</script>
