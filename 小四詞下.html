<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中文詞語互動練習</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f3eb;color:#242a33;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}
.app{max-width:1180px;margin:0 auto;padding:10px 24px 24px;border-top:8px double #111}
.tabs{display:flex;flex-wrap:wrap;gap:12px 16px;margin:18px 0 22px}
.tab,.btn{border:4px solid #111;border-radius:16px;background:#fff;padding:14px 28px;font-size:25px;font-weight:900;color:#242a33;cursor:pointer;box-shadow:0 4px 0 #111;min-height:72px}
.tab.active{background:#dcecff}
.btn:active,.tab:active{transform:translateY(2px);box-shadow:0 2px 0 #111}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:16px 20px;margin:0 0 18px;font-size:24px;font-weight:800}
select{border:4px solid #111;border-radius:8px;padding:8px 18px;font-size:25px;font-weight:900;background:#fff}
.progressOuter{width:100%;height:28px;border:4px solid #111;border-radius:999px;background:#fff;overflow:hidden;margin:14px 0 20px}
.progressInner{height:100%;width:0%;background:#96edb5}
.status{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;font-size:25px;font-weight:900;margin-bottom:20px}
.card{border:4px solid #111;border-radius:18px;background:#fff;padding:26px;min-height:330px;margin-bottom:18px}
.badge{display:inline-block;border:3px solid #111;border-radius:999px;padding:6px 14px;background:#fff7d6;font-size:20px;font-weight:900;margin-bottom:14px}
.qtitle{font-size:32px;line-height:1.5;font-weight:900;margin-bottom:18px}
.sentence{font-size:34px;line-height:1.7;font-weight:900;padding:16px 18px;border:3px solid #111;border-radius:14px;background:#fffdf8}
.inputRow{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:20px;font-size:28px;font-weight:900}
input{border:4px solid #111;border-radius:12px;padding:12px 16px;min-width:260px;max-width:100%;font-size:30px;font-weight:900;background:#fff}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:20px}
.choice{border:4px solid #111;border-radius:14px;background:#fff;padding:16px;font-size:28px;font-weight:900;cursor:pointer;text-align:center;min-height:76px}
.choice.selected{background:#dcecff}.choice.correct{background:#dcfce7}.choice.wrong{background:#fee2e2}
.feedback{font-size:26px;font-weight:900;margin:14px 0}.ok{color:#15803d}.no{color:#b91c1c}
.hint{border:3px dashed #f59e0b;background:#fffbeb;border-radius:14px;padding:14px 16px;font-size:23px;font-weight:800;line-height:1.55;margin-top:14px}
.hidden{display:none}
.wrongBox{border:4px solid #111;border-radius:18px;background:#fff;padding:18px;font-size:21px;line-height:1.6;font-weight:700}
.wrongBox b{font-size:24px}
@media(max-width:720px){.app{padding:8px 12px 18px}.tab,.btn{font-size:20px;padding:12px 18px;min-height:60px}.controls,.status{font-size:20px}.qtitle{font-size:26px}.sentence{font-size:27px}.choice{font-size:24px}input{font-size:26px;min-width:210px}}
</style>
</head>
<body>
<div class="app">
  <div class="tabs" id="tabs"></div>
  <div class="controls">
    <label>每次題數：<select id="limit" onchange="restart()"><option value="10">10</option><option value="15" selected>15</option><option value="20">20</option><option value="30">30</option><option value="50">50</option></select></label>
    <button class="btn" onclick="runSelfCheck()">自動檢查題庫</button>
  </div>
  <div class="progressOuter"><div class="progressInner" id="progress"></div></div>
  <div class="status"><div>題目：<span id="count">1 / 15</span></div><div>答對：<span id="right">0</span>　答錯：<span id="wrong">0</span>　正確率：<span id="rate">0%</span></div></div>
  <div class="card">
    <div class="badge" id="badge">混合</div>
    <div class="qtitle" id="qtitle"></div>
    <div id="questionArea"></div>
    <div class="inputRow" id="answerArea"></div>
    <div id="feedback"></div>
    <div class="hint hidden" id="hint"></div>
  </div>
  <div>
    <button class="btn" onclick="check()">檢查答案</button>
    <button class="btn" onclick="showHint()">提示</button>
    <button class="btn" onclick="nextQuestion()">下一題</button>
    <button class="btn" onclick="restart()">重新出題</button>
  </div>
  <br>
  <div class="wrongBox"><b>錯題紀錄：</b><div id="wrongList">暫時未有錯題。</div></div>
</div>

const TABS = [["mixed","混合"],["fill","填充題（不供詞）"],["mc","選擇題"],["meaning","詞義辨析"],["usage","句子判斷"],["第三十課","第三十課"],["第三十二課","第三十二課"],["第三十八課","第三十八課"],["第四十課","第四十課"],["延一","延一"]];
let mode="mixed", quiz=[], index=0, right=0, wrong=0, selected="", wrongLog=[];
function escapeHTML(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function jsAttr(s){return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");}
function norm(s){return String(s||"").trim().replace(/[\s　，。,.！!？?、；;：「」『』“”\-—]/g,"");}
function initTabs(){document.getElementById("tabs").innerHTML=TABS.map(([id,name])=>`<button class="tab ${id===mode?"active":""}" onclick="setMode('${id}')">${name}</button>`).join("");}
function setMode(m){mode=m;initTabs();restart();}
function pool(){if(mode==="mixed")return BANK;if(["fill","mc","meaning","usage"].includes(mode))return BANK.filter(q=>q.mode===mode);return BANK.filter(q=>q.lesson===mode);}
function restart(){const limit=Number(document.getElementById("limit").value||15);const p=pool();quiz=[...p].sort(()=>Math.random()-0.5).slice(0,Math.min(limit,p.length));index=0;right=0;wrong=0;selected="";wrongLog=[];render();updateStats();}
function nextQuestion(){if(!quiz.length)restart();else{index=(index+1)%quiz.length;selected="";render();updateStats();}}
function label(q){return q.mode==="fill"?"填充題":q.mode==="mc"?"選擇題":q.mode==="meaning"?"詞義辨析":"句子判斷";}
function render(){const q=quiz[index]||BANK[0];selected="";document.getElementById("badge").textContent=q.lesson+"｜"+label(q);document.getElementById("qtitle").textContent=q.q;document.getElementById("questionArea").innerHTML=`<div class="sentence">${escapeHTML(q.sentence)}</div>`;document.getElementById("hint").textContent="提示："+q.hint;document.getElementById("hint").classList.add("hidden");document.getElementById("feedback").innerHTML="";
if(q.mode==="fill"){document.getElementById("answerArea").innerHTML=`答案：<input id="answerInput" autocomplete="off" placeholder="輸入詞語">`;setTimeout(()=>document.getElementById("answerInput")?.focus(),50);}
else{document.getElementById("answerArea").innerHTML="";document.getElementById("questionArea").innerHTML+=`<div class="choices">${q.choices.map(c=>`<button class="choice" onclick="choose(this,'${jsAttr(c)}')">${escapeHTML(c)}</button>`).join("")}</div>`;}}
function choose(el,val){selected=val;document.querySelectorAll(".choice").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");}
function accepted(q){return [q.answer].concat(q.variants||[]);}
function check(){const q=quiz[index];let ok=false;if(q.mode==="fill"){ok=accepted(q).map(norm).includes(norm(document.getElementById("answerInput")?.value));}else{ok=norm(selected)===norm(q.answer);document.querySelectorAll(".choice").forEach(el=>{if(norm(el.textContent)===norm(q.answer))el.classList.add("correct");else if(el.classList.contains("selected"))el.classList.add("wrong");});}
if(ok){right++;document.getElementById("feedback").innerHTML=`<div class="feedback ok">✅ 答對！</div>`;}else{wrong++;wrongLog.push(`${q.lesson}｜${label(q)}｜${q.sentence}　答案：${q.answer}`);document.getElementById("feedback").innerHTML=`<div class="feedback no">❌ 未啱，答案是：${escapeHTML(q.answer)}</div>`;showHint();}updateStats();}
function showHint(){document.getElementById("hint").classList.remove("hidden");}
function updateStats(){const total=quiz.length||0;document.getElementById("count").textContent=total?`${index+1} / ${total}`:"0 / 0";document.getElementById("right").textContent=right;document.getElementById("wrong").textContent=wrong;const done=right+wrong;document.getElementById("rate").textContent=done?Math.round(right/done*100)+"%":"0%";document.getElementById("progress").style.width=total?((index+1)/total*100)+"%":"0%";document.getElementById("wrongList").innerHTML=wrongLog.length?wrongLog.map((x,i)=>`${i+1}. ${escapeHTML(x)}`).join("<br>"):"暫時未有錯題。";}
function runSelfCheck(){const errors=[];BANK.forEach((q,i)=>{if(!q.lesson||!q.mode||!q.answer||!q.sentence)errors.push(i+"：資料不完整");if(q.mode!=="fill"){if(!q.choices||!q.choices.includes(q.answer))errors.push(i+"：答案不在選項內");if(new Set(q.choices).size!==q.choices.length)errors.push(i+"：選項重複");}});document.getElementById("feedback").innerHTML=errors.length?`<div class="feedback no">⚠️ 題庫檢查發現問題：<br>${errors.map(escapeHTML).join("<br>")}</div>`:`<div class="feedback ok">✅ 題庫檢查通過：共 ${BANK.length} 題。</div>`;}
document.addEventListener("keydown",e=>{if(e.key==="Enter")check();});
initTabs();restart();
</script>
